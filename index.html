<table>
  <thead>
    <tr>
      <th>Customer_name</th>
      <th>Email</th>
      <th>Phone_number</th>
      <th>Status</th>
      <th style="text-align:right">Actions</th>
    </tr>
  </thead>
  <!-- data is stored in a JavaScript array of objects, which is easy to manipulate. -->
  <tbody id="rows"></tbody>
</table>


<script>
let customers = [
  { id: 1, name: "Aoife Murphy",  company: "Green Valley Meats", email: "aoife@greenvalley.ie",  phone: "+353 1 234 5678", status: "Active" },
  { id: 2, name: "Liam Byrne",    company: "Byrne Poultry Ltd",  email: "liam@byrnepoultry.ie",  phone: "+353 21 998 1122", status: "Active" },
  { id: 3, name: "Saoirse Kelly", company: "Kelly Fine Foods",   email: "s.kelly@kellyfoods.ie", phone: "+353 91 555 0303", status: "Inactive" },
];

const $ = (id) => document.getElementById(id);
    
// Each time the data changes, call render() to update the table.
function render() {
  const rows = $("rows");
  rows.innerHTML = "";
  customers.forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.name}</td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${c.status}</td>
      <td></td>`;
    rows.appendChild(tr);
  });
}

render(); // draw the initial data on page load
</script>
