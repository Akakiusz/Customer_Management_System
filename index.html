```html
<table>
  <thead>
    <tr>
      <th>Customer_name</th>
      <th>Email</th>
      <th>Phone_number</th>
      <th>Status</th>
      <th style="text-align:right">Actions</th>
    </tr>
  </thead>
  <!-- data is stored in a JavaScript array of objects, which is easy to manipulate. -->
  <tbody id="rows"></tbody>
</table>


<script>
let customers = [
  { id: 1, name: "Aoife Murphy",  company: "Green Valley Meats", email: "aoife@greenvalley.ie",  phone: "+353 1 234 5678", status: "Active" },
  { id: 2, name: "Liam Byrne",    company: "Byrne Poultry Ltd",  email: "liam@byrnepoultry.ie",  phone: "+353 21 998 1122", status: "Active" },
  { id: 3, name: "Saoirse Kelly", company: "Kelly Fine Foods",   email: "s.kelly@kellyfoods.ie", phone: "+353 91 555 0303", status: "Inactive" },
];

const $ = (id) => document.getElementById(id);
    
// Each time the data changes, call render() to update the table.
function render() {
  const rows = $("rows");
  rows.innerHTML = "";
  customers.forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.name}</td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${c.status}</td>
      <td></td>`;
    rows.appendChild(tr);
  });
}

render(); // draw the table for the first time
</script>

```html
<button class="btn" id="addBtn">+ New customer</button>

<!-- One form for both creating and editing. The form is hidden until the user clicks "New customer" or "Edit". -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <header id="formTitle">New customer</header>
    <div class="body">
      <!-- Empty hidden field to store the id of the customer being edited. If it's empty, the form is creating a new customer. -->
      <input type="hidden" id="editId">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text">
      </div>
      <!-- ...company, email, phone, status fields... -->
    </div>
    <footer>
      <button class="btn secondary" id="cancelForm">Cancel</button>
      <button class="btn" id="saveForm">Save customer</button>
    </footer>
  </div>
</div>

<script>
// null means the form is creating a new customer; otherwise, it's editing an existing customer.
function openForm(customer) {
  $("editId").value = customer ? customer.id : "";
  $("formTitle").textContent = customer ? "Edit customer" : "New customer";
  $("name").value = customer ? customer.name : "";
  // ...fill the rest of the fields the same way...
  $("formOverlay").classList.add("open");
  $("name").focus(); // focus the first field for better UX
}

function save() {
  const data = {
    name: $("name").value.trim(),
    company: $("company").value.trim(),
    email: $("email").value.trim(),
    phone: $("phone").value.trim(),
    status: $("status").value
  };
  // nextId hands out unique ids the way a database auto-increment would.
  customers.push({ id: nextId++, ...data });
  $("formOverlay").classList.remove("open");
  render(); // array changed, so redraw the table
}

let nextId = 4; // continue from the last id in the initial array (4)

$("addBtn").onclick = () => openForm(null);
$("saveForm").onclick = save;
$("cancelForm").onclick = () => $("formOverlay").classList.remove("open");
</script>
